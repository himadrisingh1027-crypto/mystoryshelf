<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F6F0E8">
    <title>Login • My Story Shelf</title>

    <link rel="stylesheet" href="assets/css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700;800&display=swap"
    rel="stylesheet">

</head>

<body class="auth-page">

<div class="auth-container">

    <!-- LEFT PANEL -->

    <div class="auth-left">

        <div class="auth-overlay"></div>

        <div class="auth-content">

            <h1>Welcome Back</h1>

            <p>
                Continue your journey through stories,
                imagination, and quiet moments.
            </p>

            <blockquote>

                "A reader lives a thousand lives before he dies."

            </blockquote>

        </div>

    </div>


    <!-- RIGHT PANEL -->

    <div class="auth-right">

        <div class="login-box">

            <h2>My Story Shelf</h2>

            <p class="subtitle">
                Sign in to continue
            </p>

            <form id="loginForm">

                <div class="input-group">

                    <input
                        type="email"
                        id="email"
                        required
                    >

                    <label>Email</label>

                </div>


                <div class="input-group">

                    <input
                        type="password"
                        id="password"
                        required
                    >

                    <label>Password</label>

                </div>

                <button type="submit">

                    Log In

                </button>

                <p id="error-message"></p>

            </form>


            <a
                href="#"
                id="forgotPassword"
                class="forgot"
            >

                Forgot Password?

            </a>


            <!-- RESET PASSWORD -->

            <div id="resetBox" class="hidden">

                <input
                    type="email"
                    id="resetEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                >

                <button id="resetBtn">

                    Send Reset Link

                </button>

                <p id="resetMsg"></p>

            </div>


            <div class="divider">

                <span>OR</span>

            </div>

            <p class="switch-page">

                Don't have an account?

                <a href="signup.html">

                    Create One

                </a>

            </p>

        </div>

    </div>

</div>

<!-- ======================================= SCRIPTS ======================================= -->

<script type="module" src="js/firebase/firebase.js"></script>

<script type="module" src="js/auth/auth.js"></script>

<script type="module" src="js/auth/log-in.js"></script>

<script type="module" src="js/auth/guest.js"></script>

<script type="module" src="js/ui/theme.js"></script>

</body>

</html>
