<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | My Story Shelf</title>

    <link rel="stylesheet" href="../assets/css/style.css">

        <link
        rel="stylesheet"
        href="https://use.fontawesome.com/releases/v6.7.2/css/all.css"
        >
        <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

<!-- ==========================================================
ADMIN HEADER
=========================================================== -->

<header class="admin-header">

    <div class="logo">

        <i class="fa-solid fa-book"></i>

        <h1>Story Publisher</h1>

    </div>

    <div class="header-actions">

        <a href="../index.html" class="home-btn">

            <i class="fa-solid fa-house"></i>

            Home

        </a>

    </div>

</header>





<!-- ==========================================================
DASHBOARD
=========================================================== -->

<main class="admin-container">

<!-- ==========================================================
TOP STATS
=========================================================== -->


<form id="storyForm">


<section class="dashboard-cards">

<div class="card">

<h3>Total Stories</h3>

<p id="storyCount">0</p>

</div>

<div class="card">

<h3>Published</h3>

<p id="publishedCount">0</p>

</div>

<div class="card">

<h3>Drafts</h3>

<p id="draftCount">0</p>

</div>

</section>





<!-- ==========================================================
STORY INFORMATION
=========================================================== -->

<section class="admin-section">

<h2>

<i class="fa-solid fa-pen"></i>

Story Information

</h2>

<div class="form-grid">

<div class="input-group">

<label for="title">

Story Title

</label>

<input
type="text"
id="title"
required>

</div>

<div class="input-group">

<label for="subtitle">

Subtitle

</label>

<input
type="text"
id="subtitle"
required>

</div>

<div class="input-group">

    <label for="author">
        Author
    </label>

    <input
        type="text"
        id="author"
        value="Himadri Singh"
        placeholder="Enter author name">

</div>

<div class="input-group">

<label for="genre">

Genre

</label>

<select id="genre" required>

<option value="Fantasy">
Fantasy
</option>

<option value="Mystery">
Mystery
</option>

<option value="Adventure">
Adventure
</option>

<option value="Romance">
Romance
</option>

<option value="Horror">
Horror
</option>

<option value="Sci-Fi">
Sci-Fi
</option>

<option value="Thriller">
Thriller
</option>

<option value="Drama">
Drama
</option>

<option value="Poetry">
Poetry
</option>

<option value="Other">
Other
</option>

</select>

</div>

<div class="input-group">

<label for="tags">

Tags

</label>

<input
type="text"
id="tags"
placeholder="magic, kingdom, war"
required>

</div>

</div>

<label for="description">
Description
</label>

<textarea
id="description"
rows="5"
required>
</textarea>

</section>

<!-- ==========================================================
BOOK APPEARANCE
=========================================================== -->

<section class="admin-section">

    <h2>
        <i class="fa-solid fa-book"></i>
        Book Appearance
    </h2>

    <div class="appearance-layout">

        <!-- APPEARANCE SETTINGS -->

        <div class="appearance-form">

            <!-- Cover Image -->

            <div class="input-group">

                <label for="coverImage">
                    Cover Image
                </label>

                <input
                    type="file"
                    id="coverImage"
                    accept="image/*">

            </div>


            <!-- Spine Colour -->

            <div class="input-group color-input-group">

                <label for="spineColor">
                    Spine Colour
                </label>

                <input
                    type="color"
                    id="spineColor"
                    value="#4d3324">

            </div>


            <!-- Title Colour -->

            <div class="input-group color-input-group">

                <label for="titleColor">
                    Title Colour
                </label>

                <input
                    type="color"
                    id="titleColor"
                    value="#f6e7c1">

            </div>


            <!-- Genre Colour -->

            <div class="input-group color-input-group">

                <label for="genreColor">
                    Genre Colour
                </label>

                <input
                    type="color"
                    id="genreColor"
                    value="#f6e7c1">

            </div>


            <!-- Author Colour -->

            <div class="input-group color-input-group">

                <label for="authorColor">
                    Author Colour
                </label>

                <input
                    type="color"
                    id="authorColor"
                    value="#f6e7c1">

            </div>

        </div>


        <!-- BOOK PREVIEW -->

        <div class="book-preview">

            <div
                class="preview-book"
                id="previewBook">

                <!-- COVER -->

                <div
                    class="preview-cover"
                    id="previewCover">

                    <div class="cover-placeholder">

                        <span>Cover</span>

                    </div>

                </div>


                <!-- SPINE -->

                <div
                    class="preview-spine"
                    id="previewSpine">

                    <div class="spine-content">

                        <span
                            id="previewTitle">
                            Story Title
                        </span>

                        <span
                            id="previewGenre">
                            Fantasy
                        </span>

                        <span
                            id="previewAuthor">
                            Himadri Singh
                        </span>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>


<!-- ==========================================================
STORY CONTENT
=========================================================== -->

<section class="admin-section">

<h2>

<i class="fa-solid fa-file-lines"></i>

Story Content

</h2>

<textarea
id="storyContent"
rows="18"
placeholder="Start writing your story..."></textarea>

</section>





<!-- ==========================================================
PUBLISHING
=========================================================== -->

<section class="admin-section">

<h2>

<i class="fa-solid fa-upload"></i>

Publishing

</h2>

<div class="publish-options">

<label for="featured">

<input
type="checkbox"
id="featured">

Featured Story

</label>

<label for="latest">

<input
type="checkbox"
id="latest">

Latest Story

</label>

<label for="draft">

<input
type="checkbox"
id="draft">

Save as Draft

</label>

</div>

<div class="publish-buttons">

<button
type="button"
id="saveDraft"
class="secondary-btn">

Save Draft

</button>

<button
type="button"
id="publishStory"
class="primary-btn">

Publish Story

</button>

</div>

</section>

    
</form>

</main>



<script type="module" src="../js/auth/protect.js"></script>

<script type="module" src="../js/admin/admin.js"></script>

<script type="module" src="../js/admin/preview.js"></script>

</body>

</html>
