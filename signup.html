<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F6F0E8">

<title>Sign Up • My Story Shelf</title>

    <link rel="stylesheet" href="assets/css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body class="auth-page">

<div class="auth-container">


    <!-- LEFT PANEL -->

    <div class="auth-left">

        <div class="auth-overlay"></div>

        <div class="auth-content">

            <h1>Begin Your Story</h1>

            <p>

            Create an account and start your reading journey.

            </p>

            <blockquote>

                "Every story begins with one thought."

            </blockquote>

        </div>

    </div>



    <!-- RIGHT PANEL -->

    <div class="auth-right">

        <div class="login-box">

            <h2>My Story Shelf</h2>

            <p class="subtitle">

                Create your account

            </p>

            <form id="signupForm">

                <div class="input-group">

                    <input
                    type="email"
                    id="email"
                    required>

                    <label>Email</label>

                </div>


                <div class="input-group">

                    <input
                    type="password"
                    id="password"
                    placeholder="Create Password"
                    autocomplete="current-password"
                    required>

                    <label>Password</label>

                </div>


                <div class="input-group">

                    <input
                    type="password"
                    id="confirmPassword" 
                    placeholder="Confirm Password"
                    autocomplete="current-password"
                    required>

                    <label>

                        Confirm Password

                    </label>

                </div>


                <button type="submit">

                    Create Account

                </button>

                <p id="message"></p>

            </form>

            <div class="divider">

                <span>OR</span>

            </div>

            <p class="switch-page">

                Already have an account?

                <a href="log-in.html">
                
                    Log In  </a>
            </p>
          </div>

    </div>

</div>

<!-- ======================================= SCRIPTS ======================================= -->

<script type="module" src="js/firebase/firebase.js">    </script>

<script type="module" src="js/auth/auth.js">    </script>

<script type="module" src="js/auth/signup.js">  </script>

<script type="module" src="js/auth/guest.js">   </script>

<script type="module" src="js/ui/theme.js">     </script>
</body>

</html>
