<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - My Story Shelf</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

  <div class="login-container">

    <!-- LEFT PANEL -->
    <div class="login-left">
      <h2>Welcome Back</h2>

      <p>
        Step into your personal library.  
        Your stories, your thoughts, your world.
      </p>

      <blockquote>
        “A reader lives a thousand lives before he dies.”
      </blockquote>
    </div>

    <!-- RIGHT PANEL -->
    <div class="login-right">

      <div class="login-box">

        <h1 class="logo">My Story Shelf</h1>

        <form id="loginForm">

          <!-- EMAIL -->
          <div class="input-group">
            <input type="text" id="email" required>
            <label for="email">Email</label>
          </div>

          <!-- PASSWORD -->
          <div class="input-group">
            <input type="password" id="password" required>
            <label for="password">Password</label>
          </div>

          <!-- LOGIN BUTTON -->
          <button type="submit">Log In</button>

          <!-- ERROR -->
          <p id="error-message"></p>

        </form>

        <div class="divider"><span>OR</span></div>

        <a href="#" id="forgotPassword" class="forgot">Forgot password?</a>

        <div class="signup-box">
          Don't have an account?
          <a href="signup.html">Sign up</a>
        </div>

      </div>

    </div>

  </div>

  <script type="module" src="log-in.js"></script>
  <script type="module" src="auth-state.js"></script>

</body>
</html>
