<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - My Story Shelf</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

  <div class="login-wrapper">

    <div class="login-box">

      <h1 class="logo">My Story Shelf</h1>

      <form id="signupForm">

        <input type="email" id="email" placeholder="Email" required>

        <input type="password" id="password" placeholder="Password(min 6 characters)" required minlength="6">

        <input type="password" id="confirmPassword" placeholder="Confirm Password" required>

        <button type="submit">Sign Up</button>

        <p id="message"></p>

      </form>

      <p class="small-text">
        Already have an account? <a href="log-in.html">Log in</a>
      </p>

    </div>

  </div>

  <script type="module" src="signup.js"></script>

  <script type="module" src="auth-state.js"></script>


</body>
</html>
